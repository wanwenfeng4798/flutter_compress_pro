name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with pubspec.yaml's `flutter:` constraint.
  FLUTTER_VERSION: 3.47.7

jobs:
  # Fast feedback: format, analyze, test. Ordered cheapest-first.
  dart:
    name: format / analyze / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Formatting
        run: dart format --output=none --set-exit-if-changed .

      # --fatal-infos so the warning count can't creep upward.
      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  # The repository checks that are cheap enough to run on every push. Each one
  # corresponds to a bug that previously reached master.
  guards:
    name: spec guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: ./tool/guards.sh

  android:
    name: android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Kotlin lint
        # ktlint via its CLI: no Gradle plugin needed, and it can't drift from
        # the build config. Must run from the repo root — ktlint resolves globs
        # against the working directory, and a `../..` prefix makes it walk far
        # outside the project. Rules are configured in .editorconfig.
        run: |
          curl -sSL -o ktlint https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          chmod +x ktlint
          ./ktlint --relative "android/src/**/*.kt"

      - name: Build example APK
        working-directory: example
        run: flutter build apk --debug

      - name: Unit tests (JVM)
        working-directory: example/android
        run: ./gradlew :flutter_compress_pro:testDebugUnitTest

  linux:
    name: linux build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install FFmpeg + Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg clang cmake ninja-build pkg-config libgtk-3-dev
      - name: FFmpeg media regressions
        run: FCP_RUN_MEDIA_TESTS=1 flutter test test/desktop_media_test.dart
      - name: Build example (linux)
        working-directory: example
        run: flutter build linux --debug
      - name: Validate real compression outputs
        working-directory: example
        run: xvfb-run -a flutter test integration_test/output_validation_test.dart -d linux

  macos-desktop:
    name: macos build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Native Darwin regression
        run: bash tool/run_darwin_checks.sh
      - name: Build example (macos)
        working-directory: example
        run: flutter build macos --debug

  ios:
    name: ios build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: SwiftLint
        # Preinstalled on the current macOS images, but don't bet the job on it
        # — that assumption is exactly what broke the Gradle step.
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          swiftlint --strict --config .swiftlint.yml

      # This is the gate that would have caught a call to a method that doesn't
      # exist on the engine — swiftc alone can't check the plugin file, because
      # it imports Flutter.
      - name: Build example (no codesign)
        working-directory: example
        run: flutter build ios --no-codesign --debug

  web:
    name: web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify vendored MP4 libraries
        run: |
          node tool/web_dependency_smoke_test.cjs
          node tool/web_engine_test.cjs
          node tool/run_browser_regression.cjs
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: example
        run: flutter build web
      - working-directory: example
        run: flutter build web --wasm

  publish-dry-run:
    name: pub publish --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Catches packaging mistakes (a stray directory getting published, a
      # too-long description) before they reach pub.dev.
      - run: flutter pub publish --dry-run
