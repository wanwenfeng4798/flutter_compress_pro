name: flutter_compress_pro
description: "Video & image compression for Android, iOS, Web, macOS, Windows & Linux. Mobile/Web/macOS use OS encoders (no FFmpeg); Windows/Linux auto-download FFmpeg when missing."
version: 0.2.0
homepage: https://github.com/wanwenfeng4798/flutter_compress_pro
repository: https://github.com/wanwenfeng4798/flutter_compress_pro

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  # Web backend (WebCodecs + mp4box/mp4-muxer via JS interop).
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.compress.all.flutter_compress_pro
        pluginClass: FlutterCompressPlugin
      ios:
        pluginClass: FlutterCompressPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: FlutterCompressPlugin
        sharedDarwinSource: true
      web:
        pluginClass: FlutterCompressWeb
        fileName: flutter_compress_pro_web.dart
      linux:
        dartPluginClass: FlutterCompressDesktop
        fileName: flutter_compress_pro_desktop.dart
      windows:
        dartPluginClass: FlutterCompressDesktop
        fileName: flutter_compress_pro_desktop.dart

  # Vendored web engine + demux/mux libraries (served at
  # assets/packages/flutter_compress_pro/assets/…), loaded lazily on web.
  assets:
    - assets/mp4box.all.min.js
    - assets/mp4-muxer.js
    - assets/flutter_compress_pro_web.js

topics:
  - video
  - compression
  - video-compression
  - media
  - transcoder
